spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_mjgl?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 322423
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  servlet:
    multipart:
      enabled: true
      max-file-size: -1        # 单个文件无限制（或设为 100MB: 100MB）
      max-request-size: -1     # 整个请求无限制（或设为 1GB: 1GB）
mybatis:
  mapper-locations: classpath:mapper/*.xml
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: mjgl-bucket

# 定时任务配置
app:
  job:
    # 智能预警规则引擎：按 cron 表达式执行，满足条件的模具会生成报警（如近30天故障≥3次）
    alert-rule:
      cron: "0 0 4 * * ?"   # 默认每天凌晨 04:00 执行（可改为如 "0 0 */6 * * ?" 每6小时）

